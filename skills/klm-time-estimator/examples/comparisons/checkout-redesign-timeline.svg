<svg viewBox="0 0 1370 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="klm-title klm-desc" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title id="klm-title">Time-on-task comparison: Checkout payment flow redesign</title>
  <desc id="klm-desc">Baseline (Checkout — Add Payment Method (current)) takes 37.78s. Proposed (Checkout — Add Payment Method (redesigned: one-click saved wallet)) takes 21.58s. Time saved: 16.20s per task.</desc>
  <defs>
    <g id="klm-icon-type">
      <rect x="-9" y="-6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="-6.5" y="-3.5" width="2.5" height="2" fill="currentColor"/>
      <rect x="-2.5" y="-3.5" width="2.5" height="2" fill="currentColor"/>
      <rect x="1.5" y="-3.5" width="2.5" height="2" fill="currentColor"/>
      <rect x="5.5" y="-3.5" width="2.5" height="2" fill="currentColor"/>
      <rect x="-6.5" y="0.5" width="13" height="2" fill="currentColor"/>
    </g>
    <g id="klm-icon-click">
      <path d="M -5,-8 L -5,7 L -1.5,4 L 1,9.5 L 4,8 L 1.5,3 L 6,3 Z" fill="currentColor"/>
      <path d="M 7,-7 L 9.5,-9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 8.5,-3 L 11.5,-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="klm-icon-clock">
      <circle cx="0" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="0" y1="0" x2="0" y2="-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="3.2" y2="2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="klm-icon-think">
      <path d="M -6,-2 C -6,-6 -2,-8 0,-7 C 2,-8 6,-6 6,-2 C 6,1 4,2 4,4 C 4,6 2,7 0,7 C -2,7 -4,6 -4,4 C -4,2 -6,1 -6,-2 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M 0,-7 C 0,-4 -1,-3 0,-1 C 1,1 0,3 0,7" fill="none" stroke="currentColor" stroke-width="1.2"/>
    </g>
    <g id="klm-icon-read">
      <path d="M -8,0 C -8,-4 -3,-7 0,-7 C 3,-7 8,-4 8,0 C 8,4 3,7 0,7 C -3,7 -8,4 -8,0 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="2.4" fill="currentColor"/>
    </g>
    <g id="klm-icon-swipe">
      <path d="M -7,2 C -3,-5 3,-5 6,-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 3,-4 L 6,-1 L 2,1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <g stroke="#dddddd" stroke-width="1">
    <line x1="631.0" y1="45" x2="631.0" y2="360"/>
    <line x1="801.0" y1="45" x2="801.0" y2="360"/>
    <line x1="971.0" y1="45" x2="971.0" y2="360"/>
    <line x1="1141.0" y1="45" x2="1141.0" y2="360"/>
    <line x1="1311.0" y1="45" x2="1311.0" y2="360"/>
  </g>
  <g fill="#767676" font-size="13" text-anchor="middle">
    <text x="631.0" y="30">0s</text>
    <text x="801.0" y="30">10s</text>
    <text x="971.0" y="30">20s</text>
    <text x="1141.0" y="30">30s</text>
    <text x="1311.0" y="30">40s</text>
  </g>
  <text x="591" y="115" text-anchor="end" font-size="15" font-weight="600" fill="#595959">Checkout — Add Payment Method (current)</text>
  <g color="#595959">
    <line x1="631" y1="110" x2="1310.9" y2="110" stroke="currentColor" stroke-width="2"/>
    <circle cx="631" cy="110" r="20" fill="#f2f2f2" stroke="currentColor" stroke-width="1.5"/>
    <text x="631" y="114" text-anchor="middle" font-size="9" fill="currentColor">START</text>
    <circle cx="1310.9" cy="110" r="20" fill="#f2f2f2" stroke="currentColor" stroke-width="1.5"/>
    <text x="1310.9" y="114" text-anchor="middle" font-size="9" fill="currentColor">END</text>
    <text x="1310.9" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">37.78s</text>
    <line x1="775.3" y1="88" x2="775.3" y2="110" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(775.3,70)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-type"/></g>
    <text x="775.3" y="128" text-anchor="middle" font-size="10" fill="currentColor">Log in</text>
    <line x1="947.2" y1="88" x2="947.2" y2="110" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(947.2,70)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-think"/></g>
    <text x="947.2" y="128" text-anchor="middle" font-size="10" fill="currentColor">Open payment form</text>
    <line x1="1108.7" y1="88" x2="1108.7" y2="110" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(1108.7,70)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-type"/></g>
    <text x="1108.7" y="128" text-anchor="middle" font-size="10" fill="currentColor">Fill card fields</text>
    <line x1="1257.9" y1="88" x2="1257.9" y2="110" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(1257.9,70)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-clock"/></g>
    <text x="1257.9" y="128" text-anchor="middle" font-size="10" fill="currentColor">System processes</text>
  </g>
  <text x="591" y="235" text-anchor="end" font-size="15" font-weight="600" fill="#0B5FFF">Checkout — Add Payment Method (redesigned: one-click saved wallet)</text>
  <g color="#0B5FFF">
    <line x1="631" y1="230" x2="1045.0" y2="230" stroke="currentColor" stroke-width="2"/>
    <circle cx="631" cy="230" r="20" fill="#f2f2f2" stroke="currentColor" stroke-width="1.5"/>
    <text x="631" y="234" text-anchor="middle" font-size="9" fill="currentColor">START</text>
    <circle cx="1045.0" cy="230" r="20" fill="#f2f2f2" stroke="currentColor" stroke-width="1.5"/>
    <text x="1045.0" y="234" text-anchor="middle" font-size="9" fill="currentColor">END</text>
    <text x="1045.0" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">21.58s</text>
    <line x1="775.3" y1="208" x2="775.3" y2="230" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(775.3,190)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-type"/></g>
    <text x="775.3" y="248" text-anchor="middle" font-size="10" fill="currentColor">Log in</text>
    <line x1="946.0" y1="208" x2="946.0" y2="230" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(946.0,190)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-think"/></g>
    <text x="946.0" y="248" text-anchor="middle" font-size="10" fill="currentColor">Pay with saved wallet</text>
    <line x1="992.0" y1="208" x2="992.0" y2="230" stroke="currentColor" stroke-width="1.5"/>
    <g transform="translate(992.0,190)"><circle r="18" fill="#ffffff" stroke="currentColor" stroke-width="2"/><use href="#klm-icon-clock"/></g>
    <text x="1055.6" y="248" text-anchor="middle" font-size="10" fill="currentColor">System processes</text>
  </g>
  <text x="591" y="345" text-anchor="end" font-size="15" font-weight="600" fill="#0B5FFF">Time saved</text>
  <g color="#0B5FFF">
    <line x1="1045.0" y1="340" x2="1310.9" y2="340" stroke="currentColor" stroke-width="2"/>
    <circle cx="1045.0" cy="340" r="20" fill="#f2f2f2" stroke="currentColor" stroke-width="1.5"/>
    <text x="1045.0" y="344" text-anchor="middle" font-size="9" fill="currentColor">START</text>
    <circle cx="1310.9" cy="340" r="20" fill="#f2f2f2" stroke="currentColor" stroke-width="1.5"/>
    <text x="1310.9" y="344" text-anchor="middle" font-size="9" fill="currentColor">END</text>
    <text x="1310.9" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">16.20s</text>
  </g>
</svg>